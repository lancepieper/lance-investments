<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#9a7020"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9952e"/>
      <stop offset="100%" stop-color="#8a6018"/>
    </linearGradient>
  </defs>
  <!-- Top face - trapezoid -->
  <polygon points="25,30 75,30 85,48 15,48" fill="url(#top)"/>
  <!-- Front face -->
  <polygon points="15,48 85,48 75,72 25,72" fill="url(#front)"/>
  <!-- Left face -->
  <polygon points="15,48 25,30 25,72" fill="#8a6018"/>
  <!-- Right face -->
  <polygon points="85,48 75,30 75,72" fill="url(#right)"/>
  <!-- Top highlight line -->
  <line x1="28" y1="33" x2="72" y2="33" stroke="#fff4b0" stroke-width="1.5" opacity="0.6"/>
  <!-- Front bevel highlight -->
  <line x1="18" y1="50" x2="82" y2="50" stroke="#e8c35a" stroke-width="1" opacity="0.5"/>
  <!-- Stamp mark on front -->
  <rect x="40" y="54" width="20" height="12" rx="1" fill="none" stroke="#b8892a" stroke-width="1.5" opacity="0.5"/>
</svg>
